name: Security and database regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autopost
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: autopost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autopost -d autopost_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://autopost:test-only-password@localhost:5432/autopost_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:css
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
